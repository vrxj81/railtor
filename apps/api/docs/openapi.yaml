openapi: 3.1.0
info:
  title: Railtor API
  version: 1.0.0
  description: |
    Authentication endpoints for the Railtor platform. This document
    captures the public contract for the JWT-based Auth flow and password
    recovery.
servers:
  - url: http://localhost:3000
    description: Local Rails API server
  - url: https://api.example.com
    description: Production placeholder
tags:
  - name: Auth
    description: Authentication endpoints
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum: [admin, editor, service, customer]
          example: customer
    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: Short-lived access token (5 minute TTL)
        refreshToken:
          type: string
          description: Rotating refresh token (14 day TTL)
    AuthSession:
      allOf:
        - $ref: "#/components/schemas/AuthTokens"
        - type: object
          required:
            - user
          properties:
            user:
              $ref: "#/components/schemas/User"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: invalid_credentials
            message:
              type: string
              example: Invalid email or password.
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: is too short (minimum is 10 characters)
    ValidationErrorsResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
paths:
  /auth/sign_up:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  format: password
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorsResponse"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign_in:
    post:
      tags: [Auth]
      summary: Sign in and obtain access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: May include context about lock state
        '423':
          description: Account locked after repeated failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token pair rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '422':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign_out:
    post:
      tags: [Auth]
      summary: Revoke a refresh token and sign out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Refresh token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '422':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: Always returns success to avoid leaking user existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email dispatched (or intentionally suppressed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Complete password reset using the emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 10
                  format: password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '422':
          description: Validation problems or missing parameters
          content:
            application/json:
              oneOf:
                - $ref: "#/components/schemas/ValidationErrorsResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
